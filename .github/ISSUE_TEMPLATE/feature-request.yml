name: Feature request
description: Propose a focused GuideFrame capability or interaction improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: checkboxes
    attributes:
      label: Existing request
      options:
        - label: I searched existing issues and did not find this request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the exact workflow problem rather than only the desired UI.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Who needs this, when does it happen, and what do they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include pointer, keyboard, cancellation, locking, and accessibility behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: api
    attributes:
      label: Possible API impact
      description: Note any new options, callbacks, exports, or controlled-state implications.

